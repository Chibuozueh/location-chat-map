<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FAF8F5" />
  <title>Atlanta Atlas · Southwest ATL Asset Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <div id="root"></div>
  <!-- Diagnostic: surface top-level module-evaluation errors so we can
       see the real cause instead of a blank page. Removed once fixed. -->
  <script>
    window.onerror = function (msg, url, line, col, error) {
      const el = document.getElementById("root");
      if (el) {
        el.innerHTML =
          '<div style="padding:24px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#b91c1c;background:#fff1f2;min-height:100vh;"><strong>Top-level runtime error:</strong><br>' +
          String(msg) +
          '<br>at ' + url + ':' + line + ':' + col + '<br><br>' +
          (error && error.stack ? error.stack : '') +
          '</div>';
      }
    };
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
